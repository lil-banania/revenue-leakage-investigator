name: Eval

on:
  push:
    branches:
      - "**"

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      BILLING_SOURCE: sim
      EVAL_MIN_CASE_OK_RATE: "1.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Run stratified eval and save report
        run: |
          mkdir -p artifacts
          python3 eval/trajectory_eval.py | tee artifacts/trajectory_eval_report.txt

      - name: Enforce eval threshold
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          report = Path("artifacts/trajectory_eval_report.txt").read_text()
          m = re.search(r"OVERALL case_ok_rate=([0-9.]+)", report)
          if not m:
              raise SystemExit("Could not find OVERALL case_ok_rate in eval report.")
          score = float(m.group(1))
          threshold = float(os.getenv("EVAL_MIN_CASE_OK_RATE", "1.0"))
          print(f"Eval case_ok_rate={score:.2f}, threshold={threshold:.2f}")
          if score < threshold:
              raise SystemExit(
                  f"Eval regression: case_ok_rate {score:.2f} is below threshold {threshold:.2f}"
              )
          PY

      - name: Upload eval artifact
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-eval-report
          path: artifacts/trajectory_eval_report.txt
